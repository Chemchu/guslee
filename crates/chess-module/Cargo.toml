[package]
name = "chess-module"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2", "charset"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = {version = "1.0.150"}
chrono = {version = "0.4.45"}
tokio = { version = "1.52.0", features = ["macros"] }
