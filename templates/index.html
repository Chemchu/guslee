<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    {{HEAD}}
    <meta name="htmx-config" content='{"includeIndicatorCSS": false}' />
    <script src="/_static/htmx.min.js"></script>
    <script src="/_static/d3-v7.min.js"></script>
    <script src="/_static/graph.js"></script>
    <script src="/_static/elo-chart.js"></script>
    <script src="/_static/mobile-search.js"></script>
    <script src="/_static/resizable.js"></script>
    <script src="/_static/preview.js"></script>
    <script src="/_static/outline.js"></script>
    <script src="/_static/explorer.js"></script>
    <script src="/_static/switcher.js"></script>

    <link rel="stylesheet" href="/_static/compiled.css" />
    <link rel="stylesheet" href="/_static/animations.css" />
    <link rel="icon" type="image/x-icon" href="/_static/favicon.ico" />
    <link rel="manifest" href="/_static/manifest.json" />
  </head>
  <body
    class="flex flex-col w-full h-dvh max-h-dvh bg-background-color text-bright-color"
    hx-boost:inherited="true"
  >
    <!-- Responsive header with search bar on mobile -->
    <div class="w-full max-h-10 flex justify-between items-center p-2 gap-2">
      <div
        class="md:hidden grow flex justify-between border border-shade-color focus-within:border-primary-color"
      >
        <input
          id="mobile-search-input"
          class="w-full px-2 py-1 text-sm focus:outline-hidden"
          type="text"
          name="query"
          placeholder="Search posts..."
          hx-get="/search"
          hx-vals='{"limit": 100}'
          hx-trigger="input changed delay:300ms, keyup[key=='Enter']"
          hx-target="#mobile-search-results"
          hx-swap="innerHTML"
        />

        <svg
          id="mobile-search-icon"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="cursor-pointer w-6 h-6 px-1 opacity-30 hover:opacity-80 shrink-0"
          hx-get="/search"
          hx-vals="js:{limit: 100, query: document.querySelector('#mobile-search-input').value}"
          hx-trigger="click"
          hx-target="#mobile-search-results"
          hx-swap="innerHTML"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"
          />
        </svg>
      </div>

      <button
        id="mobile-menu-btn"
        class="md:hidden hover:text-primary-color shrink-0 cursor-pointer"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="w-6 h-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
          />
        </svg>
      </button>

      <!-- Desktop navigation -->
      <div class="hidden md:flex gap-2 lg:gap-3">
        <a
          id="home-section"
          class="cursor-pointer hover:text-primary-color whitespace-nowrap"
          href="/posts/welcome"
          hx-trigger="click"
          hx-target="#main-section"
          hx-swap="innerHTML transition:true"
        >
          HOME
        </a>
        <span class="text-primary-color">&#8226;</span>
        <a
          id="news-section"
          class="cursor-pointer hover:text-primary-color whitespace-nowrap"
          href="/news"
          hx-trigger="click"
          hx-target="#main-section"
          hx-swap="innerHTML transition:true"
        >
          NEWS
        </a>
        <span class="text-primary-color">&#8226;</span>
        <a
          id="grader-view-section"
          class="hover:text-primary-color whitespace-nowrap cursor-pointer active:cursor-grabbing"
          href="/garden-view-dispatcher"
          hx-trigger="click"
          hx-target="#main-section"
          hx-swap="innerHTML transition:true"
        >
          GARDEN
        </a>
        <span class="text-primary-color">&#8226;</span>
        <a
          id="tags-section"
          class="cursor-pointer hover:text-primary-color whitespace-nowrap"
          href="/tags"
          hx-trigger="click"
          hx-target="#main-section"
          hx-swap="innerHTML transition:true"
        >
          TAGS
        </a>
        <span class="text-primary-color">&#8226;</span>
        <a
          id="chess-link-desktop"
          class="cursor-pointer hover:text-primary-color whitespace-nowrap"
          href="/chess/stats/blitz"
          hx-trigger="click"
          hx-target="#main-section"
          hx-swap="innerHTML"
          hx-indicator="#global-skeleton"
        >
          CHESS
        </a>
        <span class="text-primary-color">&#8226;</span>
        <a
          id="music-link-desktop"
          class="cursor-pointer hover:text-primary-color whitespace-nowrap"
          href="/music/profile"
          hx-trigger="click"
          hx-target="#main-section"
          hx-swap="innerHTML"
          hx-indicator="#global-skeleton"
        >
          MUSIC
        </a>
        <span class="text-primary-color">&#8226;</span>
        <a
          id="games-link-desktop"
          class="cursor-pointer hover:text-primary-color whitespace-nowrap"
          href="/steam"
          hx-trigger="click"
          hx-target="#main-section"
          hx-swap="innerHTML"
          hx-indicator="#global-skeleton"
        >
          GAMES
        </a>
      </div>
      <span
        id="schedule-section"
        hx-get="/schedule"
        hx-trigger="load"
        hx-target="#schedule-section"
        hx-swap="innerHTML"
        class="hidden md:block text-base lg:text-lg font-semibold truncate"
      >
        Loading schedule...
      </span>
    </div>

    <!-- Mobile search results -->
    <div
      id="mobile-search-results"
      class="hidden md:hidden absolute top-10 left-0 right-0 max-h-64 overflow-auto border-b border-shade-color bg-background-color z-50 shadow-lg px-2 pb-1"
    >
      <!-- Search results will appear here -->
    </div>
    <!-- Mobile menu dropdown -->
    <div
      id="mobile-menu"
      class="hidden md:hidden flex-col gap-2 p-4 border-t border-b border-shade-color"
    >
      <a
        id="home-section-mobile"
        class="cursor-pointer hover:text-primary-color whitespace-nowrap"
        href="/posts/welcome"
        hx-trigger="click"
        hx-target="#main-section"
        hx-swap="innerHTML transition:true"
        >HOME</a
      >
      <a
        id="news-section-mobile"
        class="cursor-pointer hover:text-primary-color whitespace-nowrap"
        href="/news"
        hx-trigger="click"
        hx-target="#main-section"
        hx-swap="innerHTML transition:true"
        >NEWS</a
      >
      <a
        id="garden-view-section-mobile"
        class="cursor-pointer hover:text-primary-color whitespace-nowrap"
        href="/garden-view-dispatcher"
        hx-trigger="click"
        hx-target="#main-section"
        hx-swap="innerHTML transition:true"
        >GARDEN</a
      >
      <a
        id="tags-section-mobile"
        class="cursor-pointer hover:text-primary-color whitespace-nowrap"
        href="/tags"
        hx-trigger="click"
        hx-target="#main-section"
        hx-swap="innerHTML transition:true"
        >TAGS</a
      >
      <a
        id="chess-link-mobile"
        href="/chess/stats/blitz"
        hx-trigger="click"
        hx-target="#main-section"
        hx-swap="innerHTML"
        hx-indicator="#global-skeleton"
        class="cursor-pointer hover:text-primary-color py-2"
      >
        CHESS
      </a>
      <a
        id="music-link-mobile"
        href="/music/profile"
        hx-trigger="click"
        hx-target="#main-section"
        hx-swap="innerHTML"
        hx-indicator="#global-skeleton"
        class="cursor-pointer hover:text-primary-color py-2"
      >
        MUSIC
      </a>
      <a
        id="games-link-mobile"
        href="/steam"
        hx-trigger="click"
        hx-target="#main-section"
        hx-swap="innerHTML"
        hx-indicator="#global-skeleton"
        class="cursor-pointer hover:text-primary-color py-2"
      >
        GAMES
      </a>
    </div>

    <div
      class="grow flex flex-col md:flex-row w-full border-t border-shade-color min-h-0"
    >
      <div
        id="left-section"
        class="hidden md:flex flex-col justify-between w-full md:w-[var(--sidebar-width,18rem)] pt-2 px-2 min-h-0 shrink-0"
      >
        <div
          class="flex justify-between border border-shade-color focus-within:border-primary-color"
        >
          <input
            id="desktop-search-input"
            class="w-full px-2 py-1 text-sm md:text-base focus:outline-hidden"
            type="text"
            name="query"
            placeholder="Search any post..."
            title="Ctrl+K opens the quick switcher"
            hx-get="/search"
            hx-vals='{"limit": 100}'
            hx-include="#explorer-view"
            hx-trigger="input changed delay:300ms, keyup[key=='Enter']"
            hx-target="#list-section"
            hx-swap="innerHTML"
          />
          <button
            id="desktop-search-clear"
            type="button"
            aria-label="Clear search"
            title="Clear search"
            hidden
            class="cursor-pointer shrink-0 px-1 opacity-30 hover:opacity-80"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="w-5 h-5 md:w-6 md:h-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18 18 6M6 6l12 12"
              />
            </svg>
          </button>
          <svg
            id="desktop-search-icon"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="cursor-pointer w-6 h-6 md:w-8 md:h-8 px-1 opacity-30 hover:opacity-80 shrink-0"
            hx-get="/search"
            hx-vals="js:{limit: 100, query: document.querySelector('#desktop-search-input').value, view: document.querySelector('#explorer-view').value}"
            hx-trigger="click"
            hx-target="#list-section"
            hx-swap="innerHTML"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"
            />
          </svg>
        </div>

        <div
          role="tablist"
          aria-label="Browse posts by"
          class="flex gap-3 pt-2 text-xs font-semibold uppercase tracking-wider"
        >
          <button
            type="button"
            role="tab"
            data-explorer-view="topics"
            aria-selected="true"
            class="text-zinc-500 hover:text-bright-color aria-selected:text-primary-color transition-colors"
          >
            Topics
          </button>
          <button
            type="button"
            role="tab"
            data-explorer-view="folders"
            aria-selected="false"
            class="text-zinc-500 hover:text-bright-color aria-selected:text-primary-color transition-colors"
          >
            Folders
          </button>
          <input type="hidden" id="explorer-view" name="view" value="topics" />
        </div>

        <div id="list-section" class="grow pt-2 overflow-auto">
          <div
            hx-get="/search"
            hx-vals="js:{limit: 100, view: window.explorerView ? window.explorerView() : 'topics'}"
            hx-trigger="load"
            hx-target="#list-section"
          >
            Loading...
          </div>
        </div>
      </div>

      <div
        id="sidebar-resizer"
        data-resizer
        data-resize-target="left-section"
        data-resize-var="--sidebar-width"
        data-resize-edge="right"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize sidebar"
        title="Drag to resize, double-click to reset"
        class="hidden md:block w-1 shrink-0 cursor-col-resize bg-shade-color hover:bg-primary-color transition-colors"
      ></div>

      <div class="relative grow min-h-0">
        <div
          id="main-section"
          class="flex flex-col lg:flex-row justify-between h-full min-h-0"
          hx-target:inherited="#main-section"
          hx-swap:inherited="innerHTML transition:true"
          hx-history-elt
        >
          {{CONTENT}}
        </div>

        <div
          id="global-skeleton"
          class="htmx-indicator absolute inset-0 z-10 flex flex-col gap-6 p-6 md:p-8 bg-background-color overflow-hidden"
        >
          <div class="skeleton-block h-8 w-64"></div>
          <div class="flex flex-col gap-2">
            <div class="skeleton-block h-3 w-full"></div>
            <div class="skeleton-block h-3 w-full"></div>
            <div class="skeleton-block h-3 w-5/6"></div>
            <div class="skeleton-block h-3 w-full"></div>
            <div class="skeleton-block h-3 w-3/4"></div>
          </div>
          <div class="skeleton-block h-6 w-48"></div>
          <div class="flex flex-col gap-2">
            <div class="skeleton-block h-3 w-full"></div>
            <div class="skeleton-block h-3 w-full"></div>
            <div class="skeleton-block h-3 w-4/5"></div>
            <div class="skeleton-block h-3 w-full"></div>
            <div class="skeleton-block h-3 w-2/3"></div>
          </div>
          <div class="border-l-2 border-shade-color pl-4 flex flex-col gap-2">
            <div class="skeleton-block h-3 w-full"></div>
            <div class="skeleton-block h-3 w-5/6"></div>
            <div class="skeleton-block h-3 w-4/5"></div>
          </div>
          <div class="skeleton-block h-6 w-36"></div>
          <div class="flex flex-col gap-2">
            <div class="skeleton-block h-3 w-full"></div>
            <div class="skeleton-block h-3 w-full"></div>
            <div class="skeleton-block h-3 w-3/4"></div>
            <div class="skeleton-block h-3 w-full"></div>
            <div class="skeleton-block h-3 w-5/6"></div>
            <div class="skeleton-block h-3 w-full"></div>
            <div class="skeleton-block h-3 w-1/2"></div>
          </div>
          <div class="skeleton-block h-6 w-52"></div>
          <div class="flex flex-col gap-2">
            <div class="skeleton-block h-3 w-full"></div>
            <div class="skeleton-block h-3 w-4/5"></div>
            <div class="skeleton-block h-3 w-full"></div>
            <div class="skeleton-block h-3 w-2/3"></div>
          </div>
        </div>
      </div>
    </div>
    <div
      class="flex flex-wrap justify-between gap-2 md:gap-4 border-t border-shade-color p-2 text-sm md:text-base lg:text-lg font-semibold"
    >
      <a
        class="hover:text-primary-color"
        target="_blank"
        rel="noopener noreferrer"
        href="https://www.github.com/Chemchu"
        >GITHUB</a
      >
      <a
        class="hover:text-primary-color"
        target="_blank"
        rel="noopener noreferrer"
        href="https://www.linkedin.com/in/gustavo-lee"
        >LINKEDIN</a
      >
      <a
        class="hover:text-primary-color"
        target="_blank"
        rel="noopener noreferrer"
        href="https://www.github.com/Chemchu/guslee.git"
        >SOURCE</a
      >
    </div>
    <script>
      // Mobile search input handler
      document
        .getElementById("mobile-search-input")
        .addEventListener("input", function () {
          const results = document.getElementById("mobile-search-results");
          if (this.value.trim() === "") {
            results.classList.add("hidden");
          } else {
            results.classList.remove("hidden");
          }
        });

      // Mobile search icon click handler
      document
        .getElementById("mobile-search-icon")
        .addEventListener("click", function () {
          const input = document.getElementById("mobile-search-input");
          if (input.value.trim() !== "") {
            document
              .getElementById("mobile-search-results")
              .classList.remove("hidden");
          }
        });

      // Mobile menu toggle
      document
        .getElementById("mobile-menu-btn")
        .addEventListener("click", function () {
          document.getElementById("mobile-menu").classList.toggle("hidden");
        });

      // Close the mobile menu once any of its links has loaded
      document
        .getElementById("mobile-menu")
        .addEventListener("htmx:after:request", function () {
          this.classList.add("hidden");
        });
    </script>
  </body>
</html>
