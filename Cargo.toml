[workspace]
members = [
    "crates/search-engine",
    "crates/chess-module",
    "crates/music-module",
    "crates/games-module",
]

[package]
name = "guslee"
version = "0.1.0"
edition = "2024"

[dependencies]
search-engine = {path = "crates/search-engine"}
chess-module = {path = "crates/chess-module"}
music-module = {path = "crates/music-module"}
games-module = {path = "crates/games-module"}
actix-files = "0.6.10"
actix-web = "4.13.0"
markdown = "1.0.0"
simple_logger = "5.2.0"
log = "0.4.32"
maud = { version = "0.27.0", features = ["actix-web"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
surrealdb = { version = "3.1.4", features = ["kv-mem", "protocol-ws"], default-features = false }
cached = {version = "2.0.2", features = ["async"]}
chrono = {version = "0.4.45"}
tokio = { version = "1.52.3", features = ["macros"] }  

[profile.dev]
opt-level = 0
incremental = true
debug = 1

[profile.dev.package."*"]
opt-level = 0

[profile.release]
lto = true
strip = true
opt-level = 3
panic = 'abort'
codegen-units = 1
